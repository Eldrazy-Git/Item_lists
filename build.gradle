plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	// REI (Architectury / shedaniel)
	maven { url = 'https://maven.shedaniel.me/' }
	maven { url = 'https://maven.architectury.dev/' }
	// JEI
	maven { url = 'https://maven.blamejared.com/' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Integrations optionnelles : compilees contre l'API, jamais embarquees. Sans ces mods, leurs
	// classes ne sont jamais chargees (seuls REI / JEI appellent nos entrypoints).
	compileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"
	compileOnly "me.shedaniel.cloth:basic-math:0.6.1"
	compileOnly "mezz.jei:jei-26.2-common-api:${project.jei_version}"
	compileOnly "mezz.jei:jei-26.2-fabric-api:${project.jei_version}"

	// Pour tester une integration en dev : ./gradlew runClient -Pviewer=rei (ou jei).
	def viewer = project.findProperty("viewer")
	if (viewer == "rei") {
		localRuntime "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"
	} else if (viewer == "jei") {
		localRuntime "mezz.jei:jei-26.2-fabric:${project.jei_version}"
	}

	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

loom {
	// Acces aux champs proteges de AbstractContainerScreen (voir le fichier pour le detail).
	accessWidenerPath = file("src/main/resources/itemlists.classtweaker")
}

// Tests en jeu automatises (./gradlew runClientGameTest) : source set "gametest", jamais inclus dans le jar.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "itemlists-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
		username = "ItemListsDev"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}
